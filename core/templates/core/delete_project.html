{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Archive Project - ResearchDoc</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar">
    <div class="logo">ResearchDoc</div>

    <ul class="nav-links">
        <li>
            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>
        </li>
    </ul>

    <a href="{% url 'logout' %}">
        <button class="btn">
            Logout
        </button>
    </a>
</nav>

<section class="dashboard-container">

    <div class="project-form-card">

        <h2>Archive Project</h2>

        <p>
            Are you sure you want to archive
            <strong>{{ project.title }}</strong>?
        </p>

        <p class="muted-text">
            This project will be hidden from your dashboard
            but safely stored in the database.
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="delete-confirm-btn">
                Yes, Archive Project
            </button>
        </form>

        <br>

        <a href="{% url 'dashboard' %}">
            Cancel and go back
        </a>

    </div>

</section>

</body>
</html>
