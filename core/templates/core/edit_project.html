{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Project - ResearchDoc</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar">
    <div class="logo">ResearchDoc</div>

    <ul class="nav-links">
        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
    </ul>

    <a href="{% url 'logout' %}">
        <button class="btn">Logout</button>
    </a>
</nav>

<section class="dashboard-container">

    <div class="project-form-card">

        <h2>Edit Project</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-full">
                Save Changes
            </button>
        </form>

        <br>

        <a href="{% url 'dashboard' %}">
            Back to Dashboard
        </a>

    </div>

</section>

</body>
</html>
